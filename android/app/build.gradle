// Songate for Android: the same source/ as the Switch and the PC, built by the repository's CMakeLists.txt (its ANDROID part)
// against the libraries tools/android/build-deps.sh made. tools/android/build.sh runs this.
plugins {
    id 'com.android.application'
}

// The version, as the Makefile has it (APP_VERSION := 2.0.0)
def appVersion = file('../../Makefile').readLines().find { it.startsWith('APP_VERSION') }.replaceAll(/^APP_VERSION[ \t:=]*/, '').trim()
def dev = (project.findProperty('dev') ?: '1') != '0'
def abis = (project.findProperty('abis') ?: 'x86_64,arm64-v8a').split(',')
// A release is signed with Songate's own key, kept for good outside the repository: an APK only updates itself when every
// version carries the same signature. The key's file, alias and passwords are in a properties file the user wrote (storeFile,
// storePassword, keyAlias, keyPassword); without it there is no signed release, only the debug build.
def keyProps = new Properties()
def keyFile = file(System.getenv('SONGATE_KEY_PROPERTIES') ?: 'C:/Android/keys/songate-release.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }
// Android installs an update only over a lower versionCode, and keeps an installed update over a SongateOS image's copy when its
// code is the same or higher. So each build has its own: major*1000000 + minor*10000 + patch*100 + the Makefile's APP_BUILD
// (2.1.0 build 1 is 2010001), one higher for each build that goes into an OS image (the user, 2026-11-18). Before: 2.0.0 was 20000
// and 2.1.0 was 20100, all below the new codes
def versionParts = (appVersion =~ /^(\d+)\.(\d+)\.(\d+)/)[0]
def appBuild = file('../../Makefile').readLines().find { it.startsWith('APP_BUILD') }.replaceAll(/^APP_BUILD[ \t:=]*/, '').trim().toInteger()
assert appBuild >= 1 && appBuild <= 99
def appVersionCode = versionParts[1].toInteger() * 1000000 + versionParts[2].toInteger() * 10000 + versionParts[3].toInteger() * 100 + appBuild

android {
    namespace 'io.github.andrythebeast.songate'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.andrythebeast.songate'
        minSdk 29
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
        externalNativeBuild {
            cmake {
                arguments "-DGF_DEV=${dev ? 'ON' : 'OFF'}", '-DANDROID_STL=c++_shared'
            }
        }
        ndk { abiFilters(*abis) }
    }

    signingConfigs {
        if (keyFile.exists()) {
            release {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug { jniDebuggable false; minifyEnabled false }   // the native code optimised even here: frames are measured
        release {
            minifyEnabled false
            if (keyFile.exists()) signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../build/assets']   // build.sh copies romfs/ there (git-ignored)
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.31.6'
            buildStagingDirectory file('.cxx')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // stored uncompressed and page-aligned, loaded from the APK itself: Android never unpacks a system image's app (SongateOS's
        // first boot found no libmain.so, 2026-11-18); the linker finds FFmpeg's beside libmain in the APK alike
        jniLibs { useLegacyPackaging false }
    }

    lint { checkReleaseBuilds false; abortOnError false }
}
